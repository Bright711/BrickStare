<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickStare | Retailer Login</title><link rel="stylesheet" href="css/retailer.css"></head>
<body class="login-page" data-page="login">
<main class="login-wrap"><section class="login-card">
  <div class="login-heading"><h1>BrickStare</h1><p>Retailer sign in</p></div>
  <form id="loginForm" class="form-stack">
    <label>Email address<input id="email" type="email" placeholder="Email" required></label>
    <label>Password<input id="password" type="password" placeholder="password" required></label>
    <div id="loginError" class="form-error hidden"></div>
    <button class="button button-primary button-full" type="submit">Sign in</button>
  </form>
  <a class="back-link" href="../shop.html">← Back to shop</a>
</section></main>
<script src="js/retailer.js"></script></body></html>
